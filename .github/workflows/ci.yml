---
name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 0 1 * *
jobs:
  Build:
    runs-on: ubuntu-26.04
    steps:
    # FIXME: workaround for https://github.com/actions/runner-images/issues/14797
    - name: Fix adduser by removing invalid skel files
      run: |
        sudo rm -rf /etc/skel/.nvm/test
    - run: |
        sudo systemctl stop apache2
        sudo apt-get remove -y apache2
    - name: Install Dependencies
      run: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker-key.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker-key.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee -i /etc/apt/sources.list.d/docker.list
        sudo apt update
        apt-cache policy docker-ce
        sudo apt-get install -y docker-ce nginx firefox hostsed
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # All of history
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-        
    - uses: asdf-vm/actions/install@v4
    - name: Install dependencies
      run: make sync
    - run: docker buildx build .
    - run: firefox --version
    - run: which firefox
    - run: |
        source .venv/bin/activate
        ./test.sh

  pre-commit:
    runs-on: ubuntu-26.04
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # All of history
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-        
    - uses: asdf-vm/actions/install@v4
    - name: Install dependencies
      run: make sync
    - run: make pre-commit
